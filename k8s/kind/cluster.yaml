# kind cluster: 1 control plane + 4 workers. 3 workers hold the PostgreSQL
# instances (one per node, pod anti-affinity), the 4th is needed to scale to
# 4 instances (G3).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sem04
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
