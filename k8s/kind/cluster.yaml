# kind cluster for G1: 1 control plane + 3 workers, so the 3 PostgreSQL
# instances can be spread across separate worker nodes (pod anti-affinity).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sem04
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
